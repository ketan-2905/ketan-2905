name: eval-run

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/eval_run.py"
      - ".github/workflows/eval-run.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-run the eval against live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/eval_run.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if git commit -m "chore: re-run profile eval"; then
            git push
          fi
