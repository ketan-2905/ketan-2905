<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Ketan Gaikwad — devil hunter, AI engineer">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a0d0d"/>
      <stop offset="55%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#070404"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#7a0f14"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d2c4"/>
      <stop offset="50%" stop-color="#8e887c"/>
      <stop offset="100%" stop-color="#4a463f"/>
    </linearGradient>
    <filter id="redglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="330" rx="10"/></clipPath>

    <!-- one chainsaw tooth, tiled along the bar -->
    <g id="tooth">
      <path d="M0 0 L13 0 L17 -9 L23 -9 L25 0 L32 0 L32 7 L0 7 Z" fill="url(#steel)"/>
      <path d="M17 -9 L23 -9 L25 0 L19 0 Z" fill="#efe9dc"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="330" fill="url(#glow)"/>

    <!-- grime streaks -->
    <g stroke="#000" stroke-opacity="0.35" stroke-width="2">
      <path d="M90 0V330M300 0V330M620 0V330M810 0V330"/>
    </g>

    <!-- ===== top chainsaw bar ===== -->
    <rect x="0" y="36" width="900" height="16" fill="#2a2520"/>
    <g>
      <g>
        <use href="#tooth" x="0" y="36"/><use href="#tooth" x="34" y="36"/><use href="#tooth" x="68" y="36"/>
        <use href="#tooth" x="102" y="36"/><use href="#tooth" x="136" y="36"/><use href="#tooth" x="170" y="36"/>
        <use href="#tooth" x="204" y="36"/><use href="#tooth" x="238" y="36"/><use href="#tooth" x="272" y="36"/>
        <use href="#tooth" x="306" y="36"/><use href="#tooth" x="340" y="36"/><use href="#tooth" x="374" y="36"/>
        <use href="#tooth" x="408" y="36"/><use href="#tooth" x="442" y="36"/><use href="#tooth" x="476" y="36"/>
        <use href="#tooth" x="510" y="36"/><use href="#tooth" x="544" y="36"/><use href="#tooth" x="578" y="36"/>
        <use href="#tooth" x="612" y="36"/><use href="#tooth" x="646" y="36"/><use href="#tooth" x="680" y="36"/>
        <use href="#tooth" x="714" y="36"/><use href="#tooth" x="748" y="36"/><use href="#tooth" x="782" y="36"/>
        <use href="#tooth" x="816" y="36"/><use href="#tooth" x="850" y="36"/><use href="#tooth" x="884" y="36"/>
        <animateTransform attributeName="transform" type="translate" from="-34 0" to="0 0" dur="0.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- blood running off the chain -->
    <g fill="url(#blood)">
      <rect x="128" y="52" width="5" height="0" rx="2">
        <animate attributeName="height" values="0;44;44;0" keyTimes="0;0.35;0.8;1" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="352" y="52" width="4" height="0" rx="2">
        <animate attributeName="height" values="0;30;30;0" keyTimes="0;0.4;0.85;1" dur="5.6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="690" y="52" width="6" height="0" rx="3">
        <animate attributeName="height" values="0;58;58;0" keyTimes="0;0.3;0.78;1" dur="5s" begin="1.9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="130" cy="96" r="0">
        <animate attributeName="r" values="0;0;4;0" keyTimes="0;0.55;0.8;1" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="96;96;150;190" keyTimes="0;0.55;0.85;1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ===== name ===== -->
    <text x="450" y="178" text-anchor="middle" font-family="Impact,'Arial Black',Haettenschweiler,sans-serif"
          font-size="74" letter-spacing="3" fill="#e01b24" filter="url(#redglow)" opacity="0.85">KETAN GAIKWAD</text>
    <text x="450" y="176" text-anchor="middle" font-family="Impact,'Arial Black',Haettenschweiler,sans-serif"
          font-size="74" letter-spacing="3" fill="#ede4d3">KETAN GAIKWAD</text>

    <!-- blood dripping off the letters -->
    <g fill="#c2161f">
      <rect x="236" y="176" width="4" height="0"><animate attributeName="height" values="0;22;22;0" dur="6s" keyTimes="0;0.3;0.85;1" repeatCount="indefinite"/></rect>
      <rect x="438" y="176" width="5" height="0"><animate attributeName="height" values="0;34;34;0" dur="7s" begin="1.2s" keyTimes="0;0.3;0.85;1" repeatCount="indefinite"/></rect>
      <rect x="612" y="176" width="4" height="0"><animate attributeName="height" values="0;18;18;0" dur="5.4s" begin="2.4s" keyTimes="0;0.3;0.85;1" repeatCount="indefinite"/></rect>
    </g>

    <text x="450" y="214" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="15" letter-spacing="7" fill="#9b9183">DEVIL HUNTER &#183; AI ENGINEER</text>

    <!-- ===== pull cord, right ===== -->
    <g transform="translate(828,52)">
      <g>
        <path d="M0 0 V74" stroke="#9c8f73" stroke-width="3" fill="none"/>
        <circle cx="0" cy="88" r="14" fill="none" stroke="#c9a227" stroke-width="5"/>
        <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="3.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ===== blood pool ===== -->
    <path d="M0 330 L0 286 Q120 268 212 290 Q318 316 430 292 Q556 266 676 294 Q790 320 900 294 L900 330 Z" fill="#8d1016"/>
    <path d="M0 330 L0 304 Q140 290 250 308 Q372 328 492 306 Q610 286 724 308 Q820 326 900 310 L900 330 Z" fill="#c2161f" opacity="0.65"/>
  </g>
</svg>
