<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Ketan Gaikwad — LLM systems engineer. An evaluation trace running.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#140f27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>

    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <path d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900M0 240H900M0 280H900"/>
      <path d="M60 0V300M120 0V300M180 0V300M240 0V300M300 0V300M360 0V300M420 0V300M480 0V300M540 0V300M600 0V300M660 0V300M720 0V300M780 0V300M840 0V300"/>
    </g>

    <rect x="-300" y="0" width="300" height="300" fill="url(#sweep)">
      <animate attributeName="x" values="-300;900" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="26" cy="26" r="5.5" fill="#ff5f57"/>
    <circle cx="46" cy="26" r="5.5" fill="#febc2e"/>
    <circle cx="66" cy="26" r="5.5" fill="#28c840"/>
    <text x="88" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#64748b">eval-run --live --grounded --explain</text>

    <text x="36" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="42" font-weight="700" fill="url(#accent)" filter="url(#glow)">Ketan Gaikwad</text>
    <text x="38" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#94a3b8">LLM systems · retrieval, guardrails &amp; evaluation</text>
    <rect x="432" y="120" width="9" height="16" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
      <text x="36" y="176" fill="#475569">retrieve.hybrid</text>
      <rect x="170" y="166" width="0" height="11" rx="3" fill="#38bdf8" opacity="0.85">
        <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.18;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="36" y="200" fill="#475569">rerank.rrf</text>
      <rect x="200" y="190" width="0" height="11" rx="3" fill="#818cf8" opacity="0.85">
        <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.16;0.34;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="36" y="224" fill="#475569">generate.schema</text>
      <rect x="250" y="214" width="0" height="11" rx="3" fill="#f472b6" opacity="0.85">
        <animate attributeName="width" values="0;0;210;210;0" keyTimes="0;0.34;0.6;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="36" y="248" fill="#475569">verify.guardrail</text>
      <rect x="320" y="238" width="0" height="11" rx="3" fill="#22d3ee" opacity="0.85">
        <animate attributeName="width" values="0;0;160;160;0" keyTimes="0;0.6;0.78;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="36" y="272" fill="#475569">verdict</text>
      <text x="170" y="272" fill="#22c55e" opacity="0">
        PASS · grounded · 0 hallucinated spans
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.84;0.95;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect x="600" y="150" width="264" height="124" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="618" y="174" font-size="10" fill="#64748b">RETRIEVAL BENCHMARK</text>
      <text x="618" y="200" font-size="22" font-weight="700" fill="#38bdf8">1.00 / 0.94</text>
      <text x="618" y="216" font-size="10" fill="#64748b">recall@3 / MRR · hybrid vs 0.83 keyword</text>
      <text x="618" y="244" font-size="22" font-weight="700" fill="#f472b6">8.8s → 17.5ms</text>
      <text x="618" y="260" font-size="10" fill="#64748b">p50 with semantic cache</text>
    </g>

    <rect x="0" y="296" width="900" height="4" fill="url(#accent)"/>
  </g>
</svg>
